# Postgres only -- the app runs on the host under `npm run dev`. Port 5433, not 5432, since a
# reviewer likely already has a Postgres on the default port.

services:
  postgres:
    image: postgres:16-alpine
    container_name: orders-api-postgres
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders_api
    ports:
      - '5433:5432'
    volumes:
      - orders-pgdata:/var/lib/postgresql/data
    healthcheck:
      # Otherwise `db:setup` immediately after `up -d` races the server's own init.
      test: ['CMD-SHELL', 'pg_isready -U orders -d orders_api']
      interval: 2s
      timeout: 3s
      retries: 15
    command:
      # Log anything slower than 200ms -- the database should say when it was slow.
      - postgres
      - -c
      - log_min_duration_statement=200
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all

volumes:
  orders-pgdata:
